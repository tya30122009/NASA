[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickx"
version = "1.0.0"
description = "NASA SPHEREx spectral-image blink comparator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "astropy>=6.0.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "urllib3>=2.2.0",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
]
